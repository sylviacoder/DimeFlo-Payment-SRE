# Do NOT commit a real secret. Create it from the RDS-managed secret instead:
#
#   SECRET_ARN=$(terraform -chdir=terraform/envs/dev output -raw db_master_secret_arn)
#   DB_HOST=$(terraform -chdir=terraform/envs/dev output -raw db_endpoint)
#   CREDS=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text)
#   kubectl -n payments create secret generic payments-db \
#     --from-literal=PGHOST="$DB_HOST" \
#     --from-literal=PGUSER="$(echo "$CREDS" | jq -r .username)" \
#     --from-literal=PGPASSWORD="$(echo "$CREDS" | jq -r .password)"
#
# Later improvement: External Secrets Operator syncing from Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: payments-db
  namespace: payments
type: Opaque
stringData:
  PGHOST: <rds-endpoint>
  PGUSER: <username>
  PGPASSWORD: <password>
